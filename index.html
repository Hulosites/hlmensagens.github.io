<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Cabeçalhos de Segurança -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <!-- Otimização de carregamento -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="style.min.css" as="style">
    <link rel="preload" href="app.min.js" as="script">
    <title>Hulo mensagens rapidas</title>
    <link rel="stylesheet" href="style.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">
    <script>
        // Tentativa de desativar F12 e DevTools
        document.onkeydown = function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.shiftKey && e.key === 'J') || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        };
    </script>
    <div id="app">
        <!-- Toast Notification System -->
        <div id="toast-container"></div>

        <!-- Tela de Configuração -->
        <section id="setup-screen" class="screen active">
            <header class="app-bar">
                <div class="brand">
                    <div class="logo-icon">HL</div>
                    
                </div>
                <button id="themeToggle" class="theme-toggle" title="Alternar Tema">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </header>
            
            <main class="content">
                <div class="input-section">
                    <label class="label">Mensagem:</label>
                    <div class="field-wrapper">
                        <textarea id="message" placeholder="Ex: Olá! Tudo bem? Gostaria de agendar..."></textarea>
                    </div>
                </div>

                <div class="input-section">
                    <label class="label">Lista de Contatos: <span class="limit-tag">Máx 20</span></label>
                    <div class="field-wrapper">
                        <textarea id="numbers" placeholder="Apenas números de telefone&#10;Ex: 5511999999999&#10;Ex: 5511888888888"></textarea>
                    </div>
                    <div class="counter" id="countLabel">0 / 20 números</div>
                </div>
            </main>

            <footer class="action-footer">
                <button id="startBtn" class="btn-main">
                    <span>ENVIAR</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </footer>
        </section>

        <!-- Tela de Envio -->
        <section id="sending-screen" class="screen">
            <header class="app-bar">
                <button id="backBtn" class="back-btn">
                <button id="themeToggleSending" class="theme-toggle" title="Alternar Tema">
                    <svg id="themeIconSending" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h1>Fluxo de Envio</h1>
            </header>

            <main class="content">
                <div class="progress-card">
                    <div class="progress-header">
                        <span class="progress-label">Progresso Total</span>
                        <span id="progressPercent" class="progress-value">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progressBar" class="progress-bar-fill"></div>
                    </div>
                    <div class="progress-footer">
                        Contato <span id="currentIndex">1</span> de <span id="totalNumbers">0</span>
                    </div>
                </div>

                <div class="current-contact-card">
                    <div class="contact-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6.51 6.32L10 16.77a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07Z"></path></svg>
                    </div>
                    <div class="contact-details">
                        <span class="detail-label">Número de Destino</span>
                        <h2 id="currentNumber">--</h2>
                    </div>
                </div>

                <div class="button-stack">
                    <a id="sendLink" target="_blank" class="btn-whatsapp">
                        <span>Abrir Conversa</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-5.2-3.1c-1.1-.6-2.3-.9-3.5-.9s-2.4.3-3.5.9A8.38 8.38 0 0 1 3 11.5c0 4.7 3.8 8.6 8.5 8.6s8.5-3.9 8.5-8.6Z"></path></svg>
                    </a>
                    <button id="nextBtn" class="btn-next">
                        Marcar como Enviado & Próximo
                    </button>
                </div>
            </main>
        </section>
    </div>

    <script src="app.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
